<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reloadsolana - Fee 5%</title>
<script src="https://unpkg.com/@solana/web3.js@1.90.1/lib/index.iife.min.js"></script>
<script src="https://unpkg.com/@solana/spl-token@0.3.8/lib/index.iife.js"></script>
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;display:flex;justify-content:center;padding:20px}
.card{background:#1a1a1a;padding:25px;border-radius:16px;max-width:430px;width:100%;text-align:center}
button{background:#9945FF;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;margin-top:12px;font-weight:bold;cursor:pointer}
button:disabled{opacity:0.5}
#info{font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<h2>reloadsolana</h2>
<p style="color:#aaa;font-size:13px">Tutup akun token kosong & klaim SOL kamu kembali.</p>
<div style="background:#1a1a1a; border:1px solid #333; padding:12px; border-radius:12px; margin:15px 0; font-size:13px; color:#aaa; text-align:left">
✅ <b style="color:white">Non-custodial:</b> Kami tidak pernah minta seed phrase<br>
✅ <b style="color:white">Transparan:</b> Fee 5% hanya dari SOL yang berhasil di-reclaim<br>
✅ <b style="color:white">Aman:</b> Transaksi bisa di-preview di Phantom sebelum approve
</div>
<button id="connectBtn">Connect Phantom</button>
<div id="info" style="margin-top:15px">Belum connect</div>
<button id="claimBtn" style="display:none">Klaim Sekarang</button>
</div>

<script>
const FEE_WALLET_STR = "HptgriUnvav3AitnWf5DWinZ7gncB5GMwMgaTFuUPNdr";
const FEE_PERCENT = 5;
let pubkey, provider, emptyAccounts=[];
const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'),'confirmed');

async function connectWallet(){
  try{
    const {solana}=window; if(!solana || !solana.isPhantom) return alert("Install Phantom Wallet dulu");
    const r=await solana.connect(); 
    pubkey=r.publicKey; provider=solana;
    document.getElementById('connectBtn').innerText=pubkey.toString().slice(0,4)+"..."+pubkey.toString().slice(-4);
    await scan();
  }catch(e){ alert("Gagal connect: "+e.message); }
}

async function scan(){
  try{
    document.getElementById('info').innerText="Scanning akun kosong...";
    document.getElementById('claimBtn').style.display="none";
    const accs=await connection.getParsedTokenAccountsByOwner(pubkey,{programId:new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")});
    emptyAccounts=[];
    accs.value.forEach(v=>{ 
      if(v.account.data.parsed.info.tokenAmount.uiAmount===0) emptyAccounts.push(v.pubkey); 
    });
    const total = emptyAccounts.length*0.00203928;
    const fee = total*FEE_PERCENT/100;
    document.getElementById('info').innerHTML=`Akun kosong: <b>${emptyAccounts.length}</b><br>Total balik: ${total.toFixed(5)} SOL<br>Fee ${FEE_PERCENT}%: ${fee.toFixed(5)} SOL<br>Kamu terima: <b>${(total - fee).toFixed(5)} SOL</b>`;
    if(emptyAccounts.length>0) document.getElementById('claimBtn').style.display="block";
  }catch(e){
    document.getElementById('info').innerText="Gagal scan: "+e.message;
  }
}

async function claim(){
  const btn = document.getElementById('claimBtn');
  try{
    btn.disabled=true; btn.innerText="Proses...";
    const {TOKEN_PROGRAM_ID} = splToken;
    const feeWallet=new solanaWeb3.PublicKey(FEE_WALLET_STR);
    let tx=new solanaWeb3.Transaction();
    const toClose = emptyAccounts.slice(0,5);
    toClose.forEach(a=>{ tx.add(splToken.Token.createCloseAccountInstruction(TOKEN_PROGRAM_ID,a,pubkey,pubkey,[])); });
    const totalLamports = toClose.length*2039280;
    const feeLamports = Math.floor(totalLamports*FEE_PERCENT/100);
    if(feeLamports>0){ tx.add(solanaWeb3.SystemProgram.transfer({fromPubkey:pubkey,toPubkey:feeWallet,lamports:feeLamports})); }
    tx.feePayer=pubkey; 
    tx.recentBlockhash=(await connection.getLatestBlockhash('confirmed')).blockhash;
    const signed=await provider.signTransaction(tx);
    const sig=await connection.sendRawTransaction(signed.serialize());
    await connection.confirmTransaction(sig,'confirmed');
    alert("Berhasil! Tx: "+sig);
    emptyAccounts = emptyAccounts.slice(5);
    await scan();
  }catch(e){ alert("Gagal klaim: "+e.message); }
  finally{ btn.disabled=false; btn.innerText="Klaim Sekarang"; }
}

document.getElementById('connectBtn').onclick=connectWallet;
document.getElementById('claimBtn').onclick=claim;

// DETEKSI HP - 1x SAJA
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
const hasPhantom = window.phantom && window.phantom.solana;
if (isMobile && !hasPhantom) {
  const popup = document.createElement('div');
  popup.style = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px;`;
  popup.innerHTML = `<div style="background: #1a1a1a; padding: 25px; border-radius: 16px; max-width: 350px; text-align: center; border: 1px solid #9945ff  try{
    btn.disabled=true; btn.innerText="Proses...";
    const {TOKEN_PROGRAM_ID} = splToken;
    const feeWallet=new solanaWeb3.PublicKey(FEE_WALLET_STR);
    let tx=new solanaWeb3.Transaction();
    const toClose = emptyAccounts.slice(0,5); // 5 per tx biar gak fail
    toClose.forEach(a=>{ 
      tx.add(splToken.Token.createCloseAccountInstruction(TOKEN_PROGRAM_ID,a,pubkey,pubkey,[])); 
    });
    const totalLamports = toClose.length*2039280;
    const feeLamports = Math.floor(totalLamports*FEE_PERCENT/100);
    if(feeLamports>0){
      tx.add(solanaWeb3.SystemProgram.transfer({fromPubkey:pubkey,toPubkey:feeWallet,lamports:feeLamports}));
    }
    tx.feePayer=pubkey; 
    tx.recentBlockhash=(await connection.getLatestBlockhash('confirmed')).blockhash;
    const signed=await provider.signTransaction(tx);
    const sig=await connection.sendRawTransaction(signed.serialize());
    await connection.confirmTransaction(sig,'confirmed');
    alert("Berhasil! Tx: "+sig);
    emptyAccounts = emptyAccounts.slice(5);
    await scan();
  }catch(e){ alert("Gagal klaim: "+e.message); }
  finally{ btn.disabled=false; btn.innerText="Klaim Sekarang"; }
}

document.getElementById('connectBtn').onclick=connectWallet;
document.getElementById('claimBtn').onclick=claim;
</script>
