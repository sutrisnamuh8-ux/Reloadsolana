<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim SOL</title>
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.8/lib/index.iife.min.js"></script>
<script src="https://unpkg.com/@solana/spl-token@0.3.8/lib/index.iife.min.js"></script>
</head>
<body style="background:#0f0f0f;color:#fff;display:flex;justify-content:center;padding:20px;font-family:Arial">
<div style="background:#1a1a1a;padding:20px;border-radius:16px;max-width:400px;width:100%;text-align:center">
<h3>Get Claim Solana</h3>
<button id="connectBtn" style="background:#9945FF;color:#fff;border:0;padding:14px;border-radius:12px;width:100%">Connect Phantom</button>
<div id="info" style="margin-top:12px">Belum connect</div>
<button id="claimBtn" style="display:none;background:#9945FF;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;margin-top:10px">Klaim</button>
</div>
<script>
let pubkey, provider, emptyList=[];
const RPCS=[
 "https://solana-rpc.publicnode.com",
 "https://rpc.ankr.com/solana",
 "https://solana.api.onfinality.io/public",
 "https://api.mainnet-beta.solana.com"
];
async function connectWallet(){
 try{
  const r=await window.solana.connect();
  pubkey=r.publicKey; provider=window.solana;
  document.getElementById('connectBtn').innerText=pubkey.toBase58().slice(0,4)+"..."+pubkey.toBase58().slice(-4);
  document.getElementById('info').innerText="Mencari...";
  document.getElementById('claimBtn').style.display="block";
  let parsed=null;
  for(let rpc of RPCS){
   try{
    document.getElementById('info').innerText="Coba: "+rpc.split('/')[2];
    const conn=new solanaWeb3.Connection(rpc,"confirmed");
    parsed=await conn.getParsedTokenAccountsByOwner(pubkey,{programId:new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")});
    if(parsed) break;
   }catch(e){}
  }
  if(!parsed) throw new Error("RPC sibuk, refresh");
  emptyList=[]; parsed.value.forEach(v=>{if(v.account.data.parsed.info.tokenAmount.uiAmount===0) emptyList.push(v.pubkey)});
  if(emptyList.length==0){document.getElementById('info').innerText="Wallet bersih";}else{document.getElementById('info').innerText=`Dapat ${emptyList.length} akun = ${(emptyList.length*0.00203928).toFixed(5)} SOL`; document.getElementById('claimBtn').innerText=`Klaim ${emptyList.length} Akun`; document.getElementById('claimBtn').disabled=false;}
 }catch(e){document.getElementById('info').innerText=e.message;}
}
async function claimNow(){
 try{
  const conn=new solanaWeb3.Connection(RPCS[0],"confirmed");
  const tx=new solanaWeb3.Transaction();
  emptyList.slice(0,5).forEach(pk=>{tx.add(splToken.Token.createCloseAccountInstruction(splToken.TOKEN_PROGRAM_ID,pk,pubkey,pubkey,[]))});
  tx.feePayer=pubkey; tx.recentBlockhash=(await conn.getLatestBlockhash()).blockhash;
  const signed=await provider.signTransaction(tx);
  const sig=await conn.sendRawTransaction(signed.serialize());
  await conn.confirmTransaction(sig); alert("Sukses "+sig); location.reload();
 }catch(e){alert(e.message);}
}
document.getElementById('connectBtn').onclick=connectWallet;
document.getElementById('claimBtn').onclick=claimNow;
</script>
</body>
</html>
