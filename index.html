<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Claim Solana</title>
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.8/lib/index.iife.min.js"></script>
<script src="https://unpkg.com/@solana/spl-token@0.3.8/lib/index.iife.min.js"></script>
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;display:flex;justify-content:center;padding:20px}
.card{background:#1a1a1a;padding:25px;border-radius:16px;max-width:430px;width:100%;text-align:center}
button{background:#9945FF;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;margin-top:12px;font-weight:bold;cursor:pointer;font-size:15px}
button:disabled{opacity:.5}
#info{font-size:14px;line-height:1.6;margin-top:15px;min-height:20px}
.logo{width:85px;height:85px;margin:10px auto;display:block}
</style>
</head>
<body>
<div class="card">
<h2>Get Claim Solana</h2>
<div style="font-size:50px">♻️</div>
<p style="color:#aaa;font-size:13px">Tutup akun token kosong & klaim SOL kembali</p>
<div style="background:#222;border:1px solid #333;padding:12px;border-radius:12px;margin:15px 0;font-size:12px;color:#aaa;text-align:left">✅ Non-custodial<br>✅ Fee 5% transparan<br>✅ Preview di Phantom</div>
<button id="connectBtn">Connect Phantom</button>
<div id="info">Belum connect</div>
<button id="claimBtn" style="display:none">Klaim Sekarang</button>
</div>

<script>
const FEE_WALLET = "HptgriUnvav3AitnWf5DWinZ7gncB5GMwMgaTFuUPNdr";
const FEE_PCT = 5;
let pubkey=null, provider=null, emptyList=[];

const RPC_LIST = [
  "https://solana-rpc.publicnode.com",
  "https://rpc.ankr.com/solana",
  "https://api.mainnet-beta.solana.com"
];

function getConn(rpc){
  return new solanaWeb3.Connection(rpc, "confirmed");
}

async function connectWallet(){
  const info = document.getElementById('info');
  const cBtn = document.getElementById('connectBtn');
  const claimBtn = document.getElementById('claimBtn');
  try{
    if(!window.solana ||!window.solana.isPhantom){
      alert("Buka di Phantom Browser > menu Browser > paste link ini");
      return;
    }
    cBtn.innerText="Connecting...";
    const resp = await window.solana.connect();
    pubkey = resp.publicKey;
    provider = window.solana;
    cBtn.innerText = pubkey.toBase58().slice(0,4)+"..."+pubkey.toBase58().slice(-4);
    info.innerText="Mencari akun kosong...";
    claimBtn.style.display="block";
    claimBtn.innerText="Loading...";
    claimBtn.disabled=true;

    let parsed = null;
    for(let rpc of RPC_LIST){
      try{
        info.innerText="Coba RPC: "+rpc.split("//")[1].slice(0,15)+"...";
        let conn = getConn(rpc);
        let p = conn.getParsedTokenAccountsByOwner(pubkey, {programId: new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")});
        let timeout = new Promise((_,rej)=>setTimeout(()=>rej("timeout"),5000));
        parsed = await Promise.race([p, timeout]);
        if(parsed) break;
      }catch(e){ console.log("RPC fail",rpc,e); }
    }
    if(!parsed) throw new Error("RPC semua sibuk, refresh lagi");

    emptyList=[];
    parsed.value.forEach(it=>{
      if(it.account.data.parsed.info.tokenAmount.uiAmount===0) emptyList.push(it.pubkey);
    });

    let total = emptyList.length * 0.00203928;
    let fee = total * FEE_PCT / 100;
    let dapat = total - fee;

    if(emptyList.length===0){
      info.innerHTML = "✅ Tidak ada akun kosong.<br>Wallet lo bersih!";
      claimBtn.innerText="Tidak ada yang diklaim";
      claimBtn.disabled=true;
    }else{
      info.innerHTML = `Akun kosong: <b>${emptyList.length}</b><br>Estimasi dapat: <b>${dapat.toFixed(5)} SOL</b> (Fee ${FEE_PCT}%)`;
      claimBtn.innerText=`Klaim ${emptyList.length} Akun`;
      claimBtn.disabled=false;
    }
  }catch(e){
    document.getElementById('info').innerText="Error: "+e.message;
    document.getElementById('connectBtn').innerText="Connect Phantom";
    document.getElementById('claimBtn').style.display="block";
    document.getElementById('claimBtn').innerText="Coba Lagi";
    document.getElementById('claimBtn').disabled=false;
    document.getElementById('claimBtn').onclick=()=>location.reload();
  }
}

async function claimNow(){
  const btn=document.getElementById('claimBtn');
  if(emptyList.length===0) return;
  btn.disabled=true; btn.innerText="Proses...";
  try{
    let conn = getConn(RPC_LIST[0]);
    let tx = new solanaWeb3.Transaction();
    let toClose = emptyList.slice(0,4); // max 4 biar gas murah
    toClose.forEach(pk=>{
      tx.add(splToken.Token.createCloseAccountInstruction(splToken.TOKEN_PROGRAM_ID, pk, pubkey, pubkey, []));
    });
    let feeLamports = Math.floor(toClose.length * 2039280 * FEE_PCT / 100);
    if(feeLamports>0){
      tx.add(solanaWeb3.SystemProgram.transfer({fromPubkey: pubkey, toPubkey: new solanaWeb3.PublicKey(FEE_WALLET), lamports: feeLamports}));
    }
    tx.feePayer=pubkey;
    tx.recentBlockhash=(await conn.getLatestBlockhash()).blockhash;
    let signed = await provider.signTransaction(tx);
    let sig = await conn.sendRawTransaction(signed.serialize());
    await conn.confirmTransaction(sig, "confirmed");
    alert("Berhasil klaim! Sig: "+sig);
    location.reload();
  }catch(e){
    alert("Gagal: "+e.message);
    btn.disabled=false; btn.innerText="Klaim Sekarang";
  }
}

document.getElementById('connectBtn').addEventListener('click', connectWallet);
document.getElementById('claimBtn').addEventListener('click', claimNow);
</script>
</body>
                             </html>
