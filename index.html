<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Claim Solana</title>
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.8/lib/index.iife.min.js"></script>
<script src="https://unpkg.com/@solana/spl-token@0.3.8/lib/index.iife.min.js"></script>
<style>
body{font-family:Arial;background:#0f0f0f;color:#fff;display:flex;justify-content:center;padding:20px}
.card{background:#1a1a1a;padding:25px;border-radius:16px;max-width:430px;width:100%;text-align:center;border:1px solid #333}
button{background:#9945FF;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;margin-top:12px;font-weight:bold;cursor:pointer;font-size:15px}
#info{margin-top:15px;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
<h2>Get Claim Solana</h2>
<p style="color:#aaa;font-size:13px">Tutup akun token kosong & klaim SOL kembali</p>
<button id="connectBtn">Connect Phantom</button>
<div id="info">Belum connect</div>
<button id="claimBtn" style="display:none">Loading...</button>
</div>

<script>
// === ISI KEY HELIUS LO DISINI ===
const HELIUS_API_KEY = "ISI_KEY_LO_DISINI";
const FEE_WALLET = "HptgriUnvav3AitnWf5DWinZ7gncB5GMwMgaTFuUPNdr";
const FEE_PCT = 5;

const RPCS = [
  `https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}`,
  "https://solana-rpc.publicnode.com",
  "https://rpc.ankr.com/solana",
  "https://api.mainnet-beta.solana.com",
  "https://solana.api.onfinality.io/public"
];

let pubkey, provider, emptyList = [];

async function connectWallet(){
  const infoEl = document.getElementById('info');
  const cBtn = document.getElementById('connectBtn');
  const claimBtn = document.getElementById('claimBtn');
  try{
    if(!window.solana) throw new Error("Buka di Phantom Browser");
    cBtn.innerText = "Connecting...";
    const r = await window.solana.connect();
    pubkey = r.publicKey; provider = window.solana;
    cBtn.innerText = pubkey.toBase58().slice(0,4)+"..."+pubkey.toBase58().slice(-4);
    infoEl.innerText = "Mencari akun kosong...";
    claimBtn.style.display="block"; claimBtn.disabled=true;

    let parsed = null;
    for(let rpc of RPCS){
      try{
        if(rpc.includes("ISI_KEY")) continue;
        infoEl.innerText = "Cek RPC: " + rpc.split('/')[2].slice(0,20);
        const conn = new solanaWeb3.Connection(rpc, "confirmed");
        parsed = await conn.getParsedTokenAccountsByOwner(pubkey, {programId: new solanaWeb3.PublicKey("TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA")});
        if(parsed){ break; }
      }catch(e){ console.log("fail",rpc); }
    }
    if(!parsed) throw new Error("Semua RPC sibuk, isi HELIUS_API_KEY dulu");

    emptyList = [];
    parsed.value.forEach(v=>{
      if(v.account.data.parsed.info.tokenAmount.uiAmount === 0) emptyList.push(v.pubkey);
    });

    const total = emptyList.length * 0.00203928;
    const dapat = total * (100 - FEE_PCT) / 100;

    if(emptyList.length === 0){
      infoEl.innerHTML = "✅ Wallet bersih, gak ada akun kosong";
      claimBtn.innerText = "Tidak ada yang diklaim";
    }else{
      infoEl.innerHTML = `Ditemukan: <b>${emptyList.length} akun kosong</b><br>Estimasi: <b>${dapat.toFixed(5)} SOL</b> (Fee ${FEE_PCT}%)`;
      claimBtn.innerText = `Klaim ${emptyList.length} Akun`;
      claimBtn.disabled = false;
    }
  }catch(e){
    document.getElementById('info').innerText = "Error: " + e.message;
    document.getElementById('connectBtn').innerText = "Connect Phantom";
  }
}

async function claimNow(){
  const btn = document.getElementById('claimBtn');
  btn.disabled = true; btn.innerText = "Proses...";
  try{
    const conn = new solanaWeb3.Connection(RPCS.find(r=>!r.includes("ISI_KEY")) || RPCS[1], "confirmed");
    const tx = new solanaWeb3.Transaction();
    const batch = emptyList.slice(0,5);

    batch.forEach(pk => {
      tx.add(splToken.Token.createCloseAccountInstruction(splToken.TOKEN_PROGRAM_ID, pk, pubkey, pubkey, []));
    });

    // Fee 5%
    const feeLamports = Math.floor(batch.length * 2039280 * FEE_PCT / 100);
    if(feeLamports > 0){
      tx.add(solanaWeb3.SystemProgram.transfer({
        fromPubkey: pubkey,
        toPubkey: new solanaWeb3.PublicKey(FEE_WALLET),
        lamports: feeLamports
      }));
    }

    tx.feePayer = pubkey;
    tx.recentBlockhash = (await conn.getLatestBlockhash()).blockhash;
    const signed = await provider.signTransaction(tx);
    const sig = await conn.sendRawTransaction(signed.serialize());
    await conn.confirmTransaction(sig, "confirmed");
    alert("SUKSES: " + sig);
    location.reload();
  }catch(e){
    alert("Gagal: " + e.message);
    btn.disabled = false; btn.innerText = "Klaim Sekarang";
  }
}

document.getElementById('connectBtn').onclick = connectWallet;
document.getElementById('claimBtn').onclick = claimNow;
</script>
</body>
  </html>
